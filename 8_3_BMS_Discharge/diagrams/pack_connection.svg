<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Connecting a 3-cell pack to the bq76920EVM</title>
<desc>Three cells in series. The pack minus goes to C0 and to jack J2 BATT-, the node between cell 1 and cell 2 goes to C1, the node between cell 2 and cell 3 goes to C2, and the pack plus goes to C5 and to jack J3 BATT+. Terminals C3 and C4 are wired to C2 to short the two unused cell inputs.</desc>
<rect width="900" height="520" fill="#ffffff"/>

<!-- J3 jack -->
<rect x="165" y="20" width="120" height="34" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="225" y="43" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a1a">J3 BATT+</text>
<line x1="225" y1="54" x2="225" y2="100" stroke="#c0392b" stroke-width="3"/>

<!-- cells -->
<g font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">
  <rect x="165" y="100" width="120" height="180" fill="#fff4e0" stroke="#d97706" stroke-width="2"/>
  <text x="225" y="185">Cell 3</text><text x="225" y="205" font-size="12" fill="#555555">read as VC5</text>
  <rect x="165" y="280" width="120" height="60" fill="#fff4e0" stroke="#d97706" stroke-width="2"/>
  <text x="225" y="306">Cell 2</text><text x="225" y="324" font-size="12" fill="#555555">read as VC2</text>
  <rect x="165" y="340" width="120" height="60" fill="#fff4e0" stroke="#d97706" stroke-width="2"/>
  <text x="225" y="366">Cell 1</text><text x="225" y="384" font-size="12" fill="#555555">read as VC1</text>
</g>
<g font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">
  <text x="152" y="105">pack +</text>
  <text x="152" y="285">node 2</text>
  <text x="152" y="345">node 1</text>
  <text x="152" y="405">pack −</text>
</g>

<!-- J2 jack -->
<line x1="225" y1="400" x2="225" y2="446" stroke="#555555" stroke-width="3"/>
<rect x="165" y="446" width="120" height="34" fill="#f4f4f4" stroke="#555555" stroke-width="2"/>
<text x="225" y="469" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a1a">J2 BATT−</text>

<!-- terminal block -->
<rect x="560" y="70" width="130" height="360" fill="#eaf6ea" stroke="#2e7d32" stroke-width="2"/>
<text x="625" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">Terminal block J1</text>
<g font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">
  <text x="625" y="105">C5</text><text x="625" y="165">C4</text><text x="625" y="225">C3</text>
  <text x="625" y="285">C2</text><text x="625" y="345">C1</text><text x="625" y="405">C0</text>
</g>

<!-- sense wires -->
<line x1="285" y1="100" x2="560" y2="100" stroke="#c0392b" stroke-width="3"/>
<polyline points="285,280 420,280 420,280 560,280" fill="none" stroke="#c0392b" stroke-width="3"/>
<line x1="285" y1="340" x2="560" y2="340" stroke="#c0392b" stroke-width="3"/>
<line x1="285" y1="400" x2="560" y2="400" stroke="#555555" stroke-width="3"/>

<!-- shorts C4-C3-C2 -->
<g stroke="#d97706" stroke-width="3" fill="none">
  <line x1="690" y1="160" x2="750" y2="160"/>
  <line x1="690" y1="220" x2="750" y2="220"/>
  <line x1="690" y1="280" x2="750" y2="280"/>
  <line x1="750" y1="160" x2="750" y2="280"/>
</g>
<text x="765" y="224" font-family="sans-serif" font-size="13" fill="#d97706">short wires:</text>
<text x="765" y="242" font-family="sans-serif" font-size="13" fill="#d97706">C4 and C3 to C2</text>
<text x="765" y="260" font-family="sans-serif" font-size="12" fill="#555555">(unused inputs)</text>

<text x="450" y="500" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Connect in this order: J2, C0, C1, C2 (and the two short wires), C5, J3. Open all S3 DIP switches afterwards.</text>
</svg>

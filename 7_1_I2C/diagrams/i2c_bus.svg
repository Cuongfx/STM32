<svg width="940" height="400" viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>I2C bus: one master and several slaves on two shared wires</title>
<desc>An I2C master and three slaves share the SCL clock line and the SDA data line. Two pull-up resistors connect SCL and SDA to Vcc. All devices share a common ground. Each slave has its own 7-bit address.</desc>
<rect width="940" height="400" fill="#ffffff"/>

<!-- Vcc rail and pull-up resistors -->
<line x1="175" y1="50" x2="255" y2="50" stroke="#c0392b" stroke-width="2.5"/>
<text x="268" y="55" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">Vcc (3.3 V)</text>

<line x1="190" y1="50" x2="190" y2="85" stroke="#c0392b" stroke-width="2"/>
<rect x="182" y="85" width="16" height="44" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<line x1="190" y1="129" x2="190" y2="200" stroke="#2f6fed" stroke-width="2"/>
<circle cx="190" cy="200" r="4.5" fill="#2f6fed"/>

<line x1="240" y1="50" x2="240" y2="85" stroke="#c0392b" stroke-width="2"/>
<rect x="232" y="85" width="16" height="44" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<line x1="240" y1="129" x2="240" y2="240" stroke="#d97706" stroke-width="2"/>
<circle cx="240" cy="240" r="4.5" fill="#d97706"/>

<text x="268" y="112" font-family="sans-serif" font-size="13" fill="#555555">Pull-up resistors</text>
<text x="268" y="130" font-family="sans-serif" font-size="13" fill="#555555">(typically 4.7 kΩ)</text>

<!-- Descriptions -->
<text x="500" y="82" font-family="sans-serif" font-size="14" fill="#2f6fed"><tspan font-weight="bold">SCL</tspan> – clock line, generated by the master</text>
<text x="500" y="106" font-family="sans-serif" font-size="14" fill="#d97706"><tspan font-weight="bold">SDA</tspan> – data line, shared and bidirectional</text>
<text x="500" y="130" font-family="sans-serif" font-size="14" fill="#555555">Every slave has its own 7-bit address</text>

<!-- Bus lines -->
<line x1="160" y1="200" x2="880" y2="200" stroke="#2f6fed" stroke-width="3"/>
<line x1="160" y1="240" x2="880" y2="240" stroke="#d97706" stroke-width="3"/>
<text x="890" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f6fed">SCL</text>
<text x="890" y="245" font-family="sans-serif" font-size="15" font-weight="bold" fill="#d97706">SDA</text>

<!-- Master -->
<rect x="30" y="150" width="130" height="140" fill="#eaf1ff" stroke="#2f6fed" stroke-width="2"/>
<text x="95" y="212" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">I2C Master</text>
<text x="95" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">STM32F446RE</text>

<!-- Slave 1 -->
<line x1="375" y1="300" x2="375" y2="200" stroke="#2f6fed" stroke-width="2.5"/>
<circle cx="375" cy="200" r="4.5" fill="#2f6fed"/>
<line x1="455" y1="300" x2="455" y2="240" stroke="#d97706" stroke-width="2.5"/>
<circle cx="455" cy="240" r="4.5" fill="#d97706"/>
<rect x="330" y="300" width="170" height="70" fill="#fff4e0" stroke="#d97706" stroke-width="2"/>
<text x="415" y="327" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Slave 1</text>
<text x="415" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">DS3231 RTC · 0x68</text>

<!-- Slave 2 -->
<line x1="575" y1="300" x2="575" y2="200" stroke="#2f6fed" stroke-width="2.5"/>
<circle cx="575" cy="200" r="4.5" fill="#2f6fed"/>
<line x1="655" y1="300" x2="655" y2="240" stroke="#d97706" stroke-width="2.5"/>
<circle cx="655" cy="240" r="4.5" fill="#d97706"/>
<rect x="530" y="300" width="170" height="70" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<text x="615" y="327" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Slave 2</text>
<text x="615" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">e.g. EEPROM · 0x57</text>

<!-- Slave 3 -->
<line x1="775" y1="300" x2="775" y2="200" stroke="#2f6fed" stroke-width="2.5"/>
<circle cx="775" cy="200" r="4.5" fill="#2f6fed"/>
<line x1="855" y1="300" x2="855" y2="240" stroke="#d97706" stroke-width="2.5"/>
<circle cx="855" cy="240" r="4.5" fill="#d97706"/>
<rect x="730" y="300" width="170" height="70" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<text x="815" y="327" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Slave 3</text>
<text x="815" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">e.g. BME280 · 0x76</text>

<!-- Common ground -->
<line x1="95" y1="290" x2="95" y2="387" stroke="#555555" stroke-width="2.5"/>
<line x1="415" y1="370" x2="415" y2="387" stroke="#555555" stroke-width="2.5"/>
<line x1="615" y1="370" x2="615" y2="387" stroke="#555555" stroke-width="2.5"/>
<line x1="815" y1="370" x2="815" y2="387" stroke="#555555" stroke-width="2.5"/>
<line x1="95" y1="387" x2="815" y2="387" stroke="#555555" stroke-width="2.5"/>
<text x="112" y="379" font-family="sans-serif" font-size="12" fill="#555555">common GND</text>
</svg>

<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>I2C read transaction: master reads registers from a slave</title>
<desc>Frame of an I2C read. The master first writes the register address with the Write bit, then sends a repeated START and the slave address with the Read bit. The slave sends the data bytes. The master answers ACK after each byte except the last, which gets NACK, then sends STOP.</desc>
<rect width="900" height="430" fill="#ffffff"/>

<!-- step markers -->
<g font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
  <circle cx="42" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="42" y="57">1</text>
  <circle cx="129" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="129" y="57">2</text>
  <circle cx="284" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="284" y="57">3</text>
  <circle cx="387" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="387" y="57">4</text>
  <circle cx="490" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="490" y="57">5</text>
  <circle cx="688" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="688" y="57">6</text>
  <circle cx="862" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="862" y="57">7</text>
</g>

<!-- master to slave (shaded) -->
<g fill="#dbe7ff" stroke="#2f6fed" stroke-width="2">
  <rect x="25" y="80" width="34" height="56"/>
  <rect x="59" y="80" width="100" height="56"/>
  <rect x="159" y="80" width="40" height="56"/>
  <rect x="229" y="80" width="110" height="56"/>
  <rect x="369" y="80" width="36" height="56"/>
  <rect x="405" y="80" width="100" height="56"/>
  <rect x="505" y="80" width="40" height="56"/>
  <rect x="655" y="80" width="30" height="56"/>
  <rect x="801" y="80" width="44" height="56"/>
  <rect x="845" y="80" width="34" height="56"/>
</g>
<!-- slave to master (white) -->
<g fill="#ffffff" stroke="#d97706" stroke-width="2">
  <rect x="199" y="80" width="30" height="56"/>
  <rect x="339" y="80" width="30" height="56"/>
  <rect x="545" y="80" width="30" height="56"/>
  <rect x="575" y="80" width="80" height="56"/>
  <rect x="721" y="80" width="80" height="56"/>
</g>

<g font-family="sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle">
  <text x="42" y="113" font-size="15" font-weight="bold">S</text>
  <text x="109" y="104">Slave address</text><text x="109" y="123">1101000</text>
  <text x="179" y="104">W</text><text x="179" y="123">0</text>
  <text x="214" y="113" font-weight="bold">A</text>
  <text x="284" y="104">Register</text><text x="284" y="123">address</text>
  <text x="354" y="113" font-weight="bold">A</text>
  <text x="387" y="113" font-size="14" font-weight="bold">Sr</text>
  <text x="455" y="104">Slave address</text><text x="455" y="123">1101000</text>
  <text x="525" y="104">R</text><text x="525" y="123">1</text>
  <text x="560" y="113" font-weight="bold">A</text>
  <text x="615" y="113">Data (n)</text>
  <text x="670" y="113" font-weight="bold">A</text>
  <text x="703" y="115" font-size="20" fill="#555555">···</text>
  <text x="761" y="113">Data (n+X)</text>
  <text x="823" y="113" font-size="12" font-weight="bold">NACK</text>
  <text x="862" y="113" font-size="15" font-weight="bold">P</text>
</g>

<!-- legend -->
<rect x="25" y="157" width="18" height="14" fill="#dbe7ff" stroke="#2f6fed" stroke-width="2"/>
<text x="50" y="169" font-family="sans-serif" font-size="13" fill="#333333">Master to slave</text>
<rect x="170" y="157" width="18" height="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="195" y="169" font-family="sans-serif" font-size="13" fill="#333333">Slave to master</text>
<text x="330" y="169" font-family="sans-serif" font-size="13" fill="#555555">S = START   Sr = repeated START   A = ACK   P = STOP</text>

<!-- steps -->
<g font-family="sans-serif" font-size="14" fill="#1a1a1a">
  <text x="25" y="207"><tspan font-weight="bold">1</tspan>  Master sends START.</text>
  <text x="25" y="229"><tspan font-weight="bold">2</tspan>  Master sends the slave address plus the Write bit (0). The slave answers ACK.</text>
  <text x="25" y="251"><tspan font-weight="bold">3</tspan>  Master sends the address of the first register to read. This sets the slave's register pointer.</text>
  <text x="25" y="273"><tspan font-weight="bold">4</tspan>  Master sends a repeated START (Sr). The bus stays claimed while the direction changes.</text>
  <text x="25" y="295"><tspan font-weight="bold">5</tspan>  Master sends the slave address plus the Read bit (1). The slave answers ACK.</text>
  <text x="25" y="317"><tspan font-weight="bold">6</tspan>  The slave sends the data, starting at the register pointer. The master answers ACK after</text>
  <text x="44" y="337">every byte except the last one, which gets NACK ("no more data").</text>
  <text x="25" y="359"><tspan font-weight="bold">7</tspan>  Master sends STOP.</text>
</g>

<text x="25" y="393" font-family="monospace" font-size="13" fill="#555555">HAL_I2C_Mem_Read(&amp;hi2c1, 0x68 &lt;&lt; 1, 0x00, I2C_MEMADD_SIZE_8BIT, buf, 7, 100);</text>
<text x="25" y="412" font-family="sans-serif" font-size="13" fill="#555555">DS3231: register address 0x00 = seconds, 7 data bytes (seconds … year).</text>
</svg>

<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wiring: DS3231 module and CH340G module on a Nucleo-F446RE</title>
<desc>The DS3231 module is wired to the Nucleo with 3V3, GND, SCL on PB8 and SDA on PB9. The CH340G USB-UART module is wired with TX on PA9 to RXD, RX on PA10 to TXD and a shared GND. The CH340G connects to the PC over USB.</desc>
<rect width="900" height="430" fill="#ffffff"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9Z" fill="#555555"/>
  </marker>
</defs>

<!-- DS3231 module -->
<rect x="30" y="70" width="170" height="210" fill="#fff4e0" stroke="#d97706" stroke-width="2"/>
<text x="115" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">DS3231 module</text>
<g font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end">
  <text x="188" y="125">VCC</text>
  <text x="188" y="165">GND</text>
  <text x="188" y="205">SCL</text>
  <text x="188" y="245">SDA</text>
</g>
<g font-family="sans-serif" font-size="12" fill="#555555">
  <text x="30" y="302">On-board pull-ups on SCL and SDA</text>
  <text x="30" y="320">Coin cell keeps the time without power</text>
  <text x="30" y="338">I2C address 0x68</text>
</g>

<!-- Nucleo -->
<rect x="360" y="70" width="250" height="310" fill="#eaf1ff" stroke="#2f6fed" stroke-width="2"/>
<text x="485" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">NUCLEO-F446RE</text>
<g font-family="sans-serif" font-size="14" fill="#1a1a1a">
  <text x="372" y="125">3V3</text>
  <text x="372" y="165">GND</text>
  <text x="372" y="205">PB8 · D15 · I2C1_SCL</text>
  <text x="372" y="245">PB9 · D14 · I2C1_SDA</text>
</g>
<g font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end">
  <text x="598" y="285">PA9 · D8 · USART1_TX</text>
  <text x="598" y="325">PA10 · D2 · USART1_RX</text>
  <text x="598" y="365">GND</text>
</g>
<text x="485" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Powered and programmed through its own ST-LINK USB</text>

<!-- I2C wires -->
<line x1="200" y1="120" x2="360" y2="120" stroke="#c0392b" stroke-width="3"/>
<line x1="200" y1="160" x2="360" y2="160" stroke="#555555" stroke-width="3"/>
<line x1="200" y1="200" x2="360" y2="200" stroke="#2f6fed" stroke-width="3"/>
<line x1="200" y1="240" x2="360" y2="240" stroke="#d97706" stroke-width="3"/>
<g font-family="sans-serif" font-size="12" text-anchor="middle">
  <text x="280" y="112" fill="#c0392b">3.3 V</text>
  <text x="280" y="152" fill="#555555">GND</text>
  <text x="280" y="192" fill="#2f6fed">SCL</text>
  <text x="280" y="232" fill="#d97706">SDA</text>
</g>

<!-- CH340G module -->
<rect x="700" y="240" width="160" height="140" fill="#eaf6ea" stroke="#2e7d32" stroke-width="2"/>
<text x="780" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">CH340G module</text>
<g font-family="sans-serif" font-size="14" fill="#1a1a1a">
  <text x="712" y="285">RXD</text>
  <text x="712" y="325">TXD</text>
  <text x="712" y="365">GND</text>
</g>
<text x="780" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Set the module to 3.3 V logic</text>

<!-- UART wires -->
<line x1="610" y1="280" x2="700" y2="280" stroke="#2e7d32" stroke-width="3"/>
<line x1="610" y1="320" x2="700" y2="320" stroke="#2e7d32" stroke-width="3"/>
<line x1="610" y1="360" x2="700" y2="360" stroke="#555555" stroke-width="3"/>
<g font-family="sans-serif" font-size="12" text-anchor="middle">
  <text x="655" y="272" fill="#2e7d32">TX → RXD</text>
  <text x="655" y="312" fill="#2e7d32">RX ← TXD</text>
  <text x="655" y="352" fill="#555555">GND</text>
</g>

<!-- PC -->
<rect x="700" y="70" width="160" height="72" fill="#f4f4f4" stroke="#555555" stroke-width="2"/>
<text x="780" y="94" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">PC</text>
<text x="780" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">Hercules on COM4</text>
<text x="780" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">115200, 8N1</text>
<line x1="780" y1="240" x2="780" y2="144" stroke="#555555" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="792" y="196" font-family="sans-serif" font-size="13" fill="#555555">USB</text>
</svg>

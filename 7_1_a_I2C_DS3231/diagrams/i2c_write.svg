<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>I2C write transaction: master writes registers in a slave</title>
<desc>Frame of an I2C write. The master sends START, the 7-bit slave address with the Write bit 0, the register address, one or more data bytes and STOP. The slave answers each byte with an ACK.</desc>
<rect width="900" height="360" fill="#ffffff"/>

<!-- step markers -->
<g font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
  <circle cx="42" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="42" y="57">1</text>
  <circle cx="139" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="139" y="57">2</text>
  <circle cx="316" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="316" y="57">3</text>
  <circle cx="607" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="607" y="57">4</text>
  <circle cx="850" cy="52" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="850" y="57">5</text>
</g>

<!-- master to slave (shaded) -->
<g fill="#dbe7ff" stroke="#2f6fed" stroke-width="2">
  <rect x="25" y="80" width="34" height="56"/>
  <rect x="59" y="80" width="120" height="56"/>
  <rect x="179" y="80" width="40" height="56"/>
  <rect x="251" y="80" width="130" height="56"/>
  <rect x="413" y="80" width="96" height="56"/>
  <rect x="541" y="80" width="96" height="56"/>
  <rect x="705" y="80" width="96" height="56"/>
  <rect x="833" y="80" width="34" height="56"/>
</g>
<!-- slave ACK (white) -->
<g fill="#ffffff" stroke="#d97706" stroke-width="2">
  <rect x="219" y="80" width="32" height="56"/>
  <rect x="381" y="80" width="32" height="56"/>
  <rect x="509" y="80" width="32" height="56"/>
  <rect x="637" y="80" width="32" height="56"/>
  <rect x="801" y="80" width="32" height="56"/>
</g>

<g font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">
  <text x="42" y="113" font-size="15" font-weight="bold">S</text>
  <text x="119" y="104">Slave address</text><text x="119" y="123">1101000</text>
  <text x="199" y="104">W</text><text x="199" y="123">0</text>
  <text x="235" y="113" font-weight="bold">A</text>
  <text x="316" y="104">Register address</text><text x="316" y="123">8 bits</text>
  <text x="397" y="113" font-weight="bold">A</text>
  <text x="461" y="113">Data (n)</text>
  <text x="525" y="113" font-weight="bold">A</text>
  <text x="589" y="113">Data (n+1)</text>
  <text x="653" y="113" font-weight="bold">A</text>
  <text x="687" y="115" font-size="20" fill="#555555">···</text>
  <text x="753" y="113">Data (n+X)</text>
  <text x="817" y="113" font-weight="bold">A</text>
  <text x="850" y="113" font-size="15" font-weight="bold">P</text>
</g>

<!-- legend -->
<rect x="25" y="157" width="18" height="14" fill="#dbe7ff" stroke="#2f6fed" stroke-width="2"/>
<text x="50" y="169" font-family="sans-serif" font-size="13" fill="#333333">Master to slave</text>
<rect x="170" y="157" width="18" height="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="195" y="169" font-family="sans-serif" font-size="13" fill="#333333">Slave to master</text>
<text x="330" y="169" font-family="sans-serif" font-size="13" fill="#555555">S = START   A = ACK   P = STOP   (every byte is followed by one ACK)</text>

<!-- steps -->
<g font-family="sans-serif" font-size="14" fill="#1a1a1a">
  <text x="25" y="207"><tspan font-weight="bold">1</tspan>  Master sends START.</text>
  <text x="25" y="229"><tspan font-weight="bold">2</tspan>  Master sends the 7-bit slave address plus the Write bit (0). The slave answers ACK.</text>
  <text x="25" y="251"><tspan font-weight="bold">3</tspan>  Master sends the address of the register to write.</text>
  <text x="25" y="273"><tspan font-weight="bold">4</tspan>  Master sends the data bytes. The register address auto-increments, so one transfer fills several registers.</text>
  <text x="25" y="295"><tspan font-weight="bold">5</tspan>  Master sends STOP.</text>
</g>

<text x="25" y="330" font-family="monospace" font-size="13" fill="#555555">HAL_I2C_Mem_Write(&amp;hi2c1, 0x68 &lt;&lt; 1, 0x00, I2C_MEMADD_SIZE_8BIT, buf, 7, 100);</text>
<text x="25" y="349" font-family="sans-serif" font-size="13" fill="#555555">DS3231: register address 0x00 = seconds, 7 data bytes (seconds … year).</text>
</svg>

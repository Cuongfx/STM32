<svg width="860" height="330" viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wiring: DS3231 module on a Nucleo-F446RE</title>
<desc>The DS3231 module is wired to the Nucleo with 3V3, GND, SCL on PB8 and SDA on PB9. The Nucleo is connected to the PC over its ST-LINK USB cable, which also carries USART2 as a virtual COM port.</desc>
<rect width="860" height="330" fill="#ffffff"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9Z" fill="#555555"/>
  </marker>
</defs>

<!-- DS3231 module -->
<rect x="30" y="50" width="170" height="210" fill="#fff4e0" stroke="#d97706" stroke-width="2"/>
<text x="115" y="76" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">DS3231 module</text>
<g font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end">
  <text x="188" y="115">VCC</text>
  <text x="188" y="155">GND</text>
  <text x="188" y="195">SCL</text>
  <text x="188" y="235">SDA</text>
</g>
<g font-family="sans-serif" font-size="12" fill="#555555">
  <text x="30" y="282">On-board pull-ups on SCL and SDA</text>
  <text x="30" y="300">Coin cell keeps the time without power</text>
</g>

<!-- Nucleo -->
<rect x="360" y="50" width="250" height="210" fill="#eaf1ff" stroke="#2f6fed" stroke-width="2"/>
<text x="485" y="76" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">NUCLEO-F446RE</text>
<g font-family="sans-serif" font-size="14" fill="#1a1a1a">
  <text x="372" y="115">3V3</text>
  <text x="372" y="155">GND</text>
  <text x="372" y="195">PB8 (D15) · I2C1_SCL</text>
  <text x="372" y="235">PB9 (D14) · I2C1_SDA</text>
</g>

<!-- wires -->
<line x1="200" y1="110" x2="360" y2="110" stroke="#c0392b" stroke-width="3"/>
<line x1="200" y1="150" x2="360" y2="150" stroke="#555555" stroke-width="3"/>
<line x1="200" y1="190" x2="360" y2="190" stroke="#2f6fed" stroke-width="3"/>
<line x1="200" y1="230" x2="360" y2="230" stroke="#2f6fed" stroke-width="3"/>
<g font-family="sans-serif" font-size="12" text-anchor="middle">
  <text x="280" y="102" fill="#c0392b">3.3 V</text>
  <text x="280" y="142" fill="#555555">GND</text>
  <text x="280" y="182" fill="#2f6fed">SCL</text>
  <text x="280" y="222" fill="#2f6fed">SDA</text>
</g>

<!-- PC -->
<rect x="720" y="50" width="130" height="90" fill="#f4f4f4" stroke="#555555" stroke-width="2"/>
<text x="785" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">PC</text>
<text x="785" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">Terminal on COM3</text>
<text x="785" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">115200, 8N1</text>
<line x1="610" y1="95" x2="718" y2="95" stroke="#555555" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="664" y="84" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">ST-LINK USB</text>
<text x="664" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">USART2 as COM port</text>
</svg>

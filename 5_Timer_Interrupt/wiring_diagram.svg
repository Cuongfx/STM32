<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wiring diagram for the HC-SR04 timer/interrupt distance LED project</title>
<desc>Nucleo-F446RE powers an HC-SR04 ultrasonic sensor from 5V. TRIG is driven directly from PB0 (A3). ECHO is a 5V signal, so it is dropped to about 3.3V through a 1k/2k resistor divider before reaching PA1 (A1). An LED with a series resistor is driven from PB6 (D10, TIM4_CH1 PWM). The sensor GND, the divider bottom and the LED cathode all join one GND line that starts at the Nucleo GND pin.</desc>
<rect width="680" height="620" fill="#ffffff"/>

<!-- Nucleo -->
<rect x="30" y="30" width="200" height="570" rx="10" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="130" y="58" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Nucleo-F446RE</text>

<g font-family="sans-serif" text-anchor="end">
  <text x="218" y="86" font-size="13" font-weight="700" fill="#c0392b">5V</text>
  <text x="218" y="136" font-size="13" font-weight="700" fill="#1a1a1a">PB0 (A3)</text>
  <text x="218" y="155" font-size="11" fill="#555555">Trig output</text>
  <text x="218" y="296" font-size="13" font-weight="700" fill="#1a1a1a">PA1 (A1)</text>
  <text x="218" y="315" font-size="11" fill="#555555">EXTI1 · Echo input (3.3 V)</text>
  <text x="218" y="466" font-size="13" font-weight="700" fill="#555555">GND</text>
  <text x="218" y="536" font-size="13" font-weight="700" fill="#1a1a1a">PB6 (D10)</text>
  <text x="218" y="555" font-size="11" fill="#555555">TIM4_CH1 PWM</text>
</g>

<!-- HC-SR04 -->
<rect x="380" y="60" width="180" height="190" rx="8" fill="#eaf1ff" stroke="#2f6fed" stroke-width="2"/>
<text x="470" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">HC-SR04</text>
<g font-family="sans-serif" font-size="13" fill="#1a1a1a">
  <text x="392" y="94">VCC</text>
  <text x="392" y="144">Trig</text>
  <text x="392" y="194">Echo</text>
</g>
<text x="470" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a1a">GND</text>

<!-- 5V -> VCC, PB0 -> Trig -->
<line x1="230" y1="90" x2="380" y2="90" stroke="#c0392b" stroke-width="2.5"/>
<line x1="230" y1="140" x2="380" y2="140" stroke="#2f6fed" stroke-width="2.5"/>

<!-- Echo (5 V) -> divider -> PA1 (3.3 V) -->
<line x1="380" y1="190" x2="320" y2="190" stroke="#d97706" stroke-width="2.5"/>
<line x1="320" y1="190" x2="320" y2="230" stroke="#d97706" stroke-width="2.5"/>
<text x="350" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d97706">5 V logic</text>
<rect x="305" y="230" width="30" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="345" y="260" font-family="sans-serif" font-size="12" fill="#1a1a1a">R1 = 1kΩ</text>
<line x1="320" y1="280" x2="320" y2="320" stroke="#2f6fed" stroke-width="2.5"/>
<line x1="230" y1="300" x2="320" y2="300" stroke="#2f6fed" stroke-width="2.5"/>
<circle cx="320" cy="300" r="4.5" fill="#2f6fed"/>
<text x="334" y="304" font-family="sans-serif" font-size="11" fill="#2f6fed">≈ 3.3 V to PA1</text>
<rect x="305" y="320" width="30" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="345" y="350" font-family="sans-serif" font-size="12" fill="#1a1a1a">R2 = 2kΩ</text>
<line x1="320" y1="370" x2="320" y2="470" stroke="#555555" stroke-width="2.5"/>

<!-- GND line: Nucleo GND, divider, sensor GND, LED cathode -->
<line x1="230" y1="470" x2="520" y2="470" stroke="#555555" stroke-width="2.5"/>
<line x1="470" y1="250" x2="470" y2="470" stroke="#555555" stroke-width="2.5"/>
<circle cx="320" cy="470" r="4.5" fill="#555555"/>
<circle cx="470" cy="470" r="4.5" fill="#555555"/>
<circle cx="520" cy="470" r="4.5" fill="#555555"/>

<!-- PB6 -> resistor -> LED -> GND line -->
<line x1="230" y1="540" x2="290" y2="540" stroke="#2f6fed" stroke-width="2.5"/>
<rect x="290" y="530" width="60" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="320" y="522" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a1a1a">R 330Ω</text>
<line x1="350" y1="540" x2="410" y2="540" stroke="#2f6fed" stroke-width="2.5"/>
<polygon points="410,526 410,554 438,540" fill="#f5a623" stroke="#8a5a00" stroke-width="1.5"/>
<line x1="438" y1="526" x2="438" y2="554" stroke="#8a5a00" stroke-width="2"/>
<line x1="442" y1="530" x2="450" y2="522" stroke="#8a5a00" stroke-width="1.5"/>
<line x1="442" y1="538" x2="450" y2="530" stroke="#8a5a00" stroke-width="1.5"/>
<text x="424" y="578" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">LEDY</text>
<line x1="438" y1="540" x2="520" y2="540" stroke="#555555" stroke-width="2.5"/>
<line x1="520" y1="540" x2="520" y2="470" stroke="#555555" stroke-width="2.5"/>
</svg>

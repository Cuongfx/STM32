<svg width="840" height="360" viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sending the byte 0x93 over UART</title>
<desc>The byte 0x93, binary 1001 0011, is sent from TX to RX. The line idles high, then a start bit pulls it low, the eight data bits follow least-significant bit first as 1 1 0 0 1 0 0 1, and a stop bit returns the line high.</desc>
<rect width="840" height="360" fill="#ffffff"/>
<defs>
  <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9Z" fill="#1fa2e0"/>
  </marker>
</defs>

<text x="20" y="30" font-family="sans-serif" font-size="15" fill="#1a1a1a">Suppose we need to send one byte, <tspan fill="#c0392b" font-weight="700">0x93</tspan>:</text>
<text x="20" y="54" font-family="sans-serif" font-size="15" fill="#1a1a1a"><tspan fill="#c0392b" font-weight="700">0x93</tspan> = 1001 0011   (sent least-significant bit first: 1 1 0 0 1 0 0 1)</text>

<!-- TX / RX boxes -->
<rect x="20" y="100" width="100" height="220" fill="#ee7c6b" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="70" y="215" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">TX</text>
<rect x="720" y="100" width="100" height="220" fill="#4a86e8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="770" y="215" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">RX</text>

<!-- slot separators -->
<line x1="170" y1="130" x2="170" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="220" y1="130" x2="220" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="270" y1="130" x2="270" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="320" y1="130" x2="320" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="370" y1="130" x2="370" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="420" y1="130" x2="420" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="470" y1="130" x2="470" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="520" y1="130" x2="520" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="570" y1="130" x2="570" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="620" y1="130" x2="620" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="670" y1="130" x2="670" y2="258" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3 3"/>

<!-- waveform -->
<polyline points="135,150 170,150 170,210 220,210 220,150 320,150 320,210 420,210 420,150 470,150 470,210 570,210 570,150 705,150" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="miter"/>
<text x="150" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#777777">idle</text>
<text x="690" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#777777">idle</text>

<!-- bit values -->
<text x="195" y="238" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1a1a1a">0</text>
<text x="245" y="238" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1a1a1a">1</text>
<text x="295" y="238" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1a1a1a">1</text>
<text x="345" y="238" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1a1a1a">0</text>
<text x="395" y="238" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1a1a1a">0</text>
<text x="445" y="238" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1a1a1a">1</text>
<text x="495" y="238" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1a1a1a">0</text>
<text x="545" y="238" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1a1a1a">0</text>
<text x="595" y="238" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1a1a1a">1</text>
<text x="645" y="238" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1a1a1a">1</text>

<!-- slot names -->
<text x="195" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2f6fed">START</text>
<text x="245" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#777777">D0</text>
<text x="295" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#777777">D1</text>
<text x="345" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#777777">D2</text>
<text x="395" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#777777">D3</text>
<text x="445" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#777777">D4</text>
<text x="495" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#777777">D5</text>
<text x="545" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#777777">D6</text>
<text x="595" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#777777">D7</text>
<text x="645" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2f6fed">STOP</text>

<!-- data line TX -> RX -->
<line x1="120" y1="295" x2="718" y2="295" stroke="#1fa2e0" stroke-width="2.5" marker-end="url(#c)"/>
<text x="420" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Single wire from TX to RX: start bit (0), 8 data bits, stop bit (1)</text>
</svg>
